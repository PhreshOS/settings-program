<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Breeze</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dfe7da }
  @media (prefers-color-scheme: dark) { html, body { background: #0a121c } }
  canvas { display: block; width: 100%; height: 100% }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
// A calm field under a low sun: wind passes over the grass in gusts, a few birds glide across.
// By night the sun becomes a moon, the birds rest, and a few fireflies rise from the grass.
// Light on purpose: at most 30 frames a second, the sky drawn once and kept, blades of one
// shade drawn in one stroke, a lower resolution on large screens, and nothing at all while hidden.
(function () {
  "use strict"

  var DAY = {
    sky: ["#9cc0d8", "#c7dbe0", "#ecebd8", "#f8e3bf"],
    glow: [255, 224, 168], disc: "#fff6dc",
    hills: ["#b9c6b4", "#9fb595", "#88a67a"],
    field: ["#9fb377", "#7a9850", "#577a36"],
    grass: [[82, 28, 54], [86, 32, 44], [90, 36, 33]],
    bird: "rgba(52, 60, 58, 0.62)", star: 0
  }
  var NIGHT = {
    sky: ["#060b16", "#0c1729", "#16263c", "#22344a"],
    glow: [176, 196, 236], disc: "#e6ecf6",
    hills: ["#1c2a38", "#17242e", "#132026"],
    field: ["#1a2827", "#13211d", "#0c1814"],
    grass: [[150, 14, 19], [142, 18, 15], [134, 22, 11]],
    bird: "rgba(0, 0, 0, 0)", star: 1
  }

  var canvas = document.getElementById("field")
  var ctx = canvas.getContext("2d", { alpha: false })
  var sky = document.createElement("canvas")
  var skyCtx = sky.getContext("2d", { alpha: false })

  var W = 0, H = 0, DPR = 1, horizon = 0
  var layers = [], birds = [], fireflies = [], stars = []
  var birdWait = 4

  var darkQuery = window.matchMedia("(prefers-color-scheme: dark)")
  var still = window.matchMedia("(prefers-reduced-motion: reduce)")
  var night = darkQuery.matches ? 1 : 0, nightTarget = night, skyKey = ""

  function random(a, b) { return a + Math.random() * (b - a) }
  function mix(a, b, t) { return a + (b - a) * t }
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] }
  function color(d, n, t) {
    var a = hex(d), b = hex(n)
    return "rgb(" + Math.round(mix(a[0], b[0], t)) + "," + Math.round(mix(a[1], b[1], t)) + "," + Math.round(mix(a[2], b[2], t)) + ")"
  }

  // Rolling ground: a few long, slow waves, so the hills never repeat a shape.
  function ridge(x, seed, height) {
    var u = x / W
    return (Math.sin(u * 2.3 + seed) * 0.5 + Math.sin(u * 5.1 + seed * 2.7) * 0.28 + Math.sin(u * 11.7 + seed * 1.3) * 0.12) * height
  }

  function build() {
    var area = W * H
    // Each layer: depth (0 far, 1 near), blade count, height range, stroke width, wind reach.
    var plan = [
      { from: 0.00, to: 0.35, count: W / 1.6, h: [5, 14], width: 1.1, reach: 0.22 },
      { from: 0.22, to: 0.72, count: W / 1.9, h: [16, 44], width: 1.7, reach: 0.38 },
      { from: 0.55, to: 1.06, count: W / 2.2, h: [46, 128], width: 2.8, reach: 0.55 }
    ]
    var budget = area > 2560 * 1440 ? 0.7 : 1
    layers = plan.map(function (p, index) {
      var blades = []
      var count = Math.floor(p.count * budget)
      for (var i = 0; i < count; i++) {
        var depth = random(p.from, p.to)
        var scale = 0.55 + depth * 0.6
        blades.push({
          x: random(-20, W + 20),
          y: horizon + Math.pow(depth, 1.4) * (H - horizon) + 6,
          h: random(p.h[0], p.h[1]) * scale,
          lean: random(-0.18, 0.18),
          phase: random(0, 6.283), flutter: random(1.2, 2.4),
          shade: Math.floor(random(0, 4))
        })
      }
      // Far blades first, so nearer ones cover them.
      blades.sort(function (a, b) { return a.y - b.y })
      return { blades: blades, width: p.width, reach: p.reach, tone: index }
    })
    stars = []
    for (var s = 0; s < Math.floor(W / 9); s++) stars.push({ x: random(0, W), y: random(0, horizon * 0.85), r: random(0.4, 1.3), a: random(0.25, 0.9) })
    fireflies = []
    for (var f = 0; f < 18; f++) fireflies.push({ x: random(0, W), y: random(horizon + 10, H * 0.92), phase: random(0, 6.283), speed: random(0.15, 0.4), dx: random(-8, 8) })
  }

  // The sky, the sun or moon, the hills and the ground under the grass: drawn once per size and
  // per step of the change between day and night, then copied every frame.
  function paintSky() {
    var step = Math.round(night * 20)
    var key = W + "x" + H + ":" + step
    if (key === skyKey) return
    skyKey = key
    var t = step / 20
    sky.width = Math.max(2, Math.floor(W * DPR)); sky.height = Math.max(2, Math.floor(H * DPR))
    skyCtx.setTransform(DPR, 0, 0, DPR, 0, 0)

    var g = skyCtx.createLinearGradient(0, 0, 0, horizon)
    for (var i = 0; i < 4; i++) g.addColorStop(i / 3, color(DAY.sky[i], NIGHT.sky[i], t))
    skyCtx.fillStyle = g; skyCtx.fillRect(0, 0, W, H)

    if (t > 0) {
      for (var k = 0; k < stars.length; k++) {
        var star = stars[k]
        skyCtx.globalAlpha = star.a * t * (1 - star.y / horizon * 0.6)
        skyCtx.fillStyle = "#eef3ff"
        skyCtx.beginPath(); skyCtx.arc(star.x, star.y, star.r, 0, 6.283); skyCtx.fill()
      }
      skyCtx.globalAlpha = 1
    }

    // The sun sits low, just above the hills; the moon rides higher.
    var sx = W * 0.7, sy = mix(horizon - H * 0.06, H * 0.2, t)
    var light = [mix(DAY.glow[0], NIGHT.glow[0], t), mix(DAY.glow[1], NIGHT.glow[1], t), mix(DAY.glow[2], NIGHT.glow[2], t)].map(Math.round).join(",")
    var glow = skyCtx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * mix(0.55, 0.3, t))
    glow.addColorStop(0, "rgba(" + light + "," + mix(0.85, 0.5, t) + ")")
    glow.addColorStop(0.18, "rgba(" + light + "," + mix(0.32, 0.12, t) + ")")
    glow.addColorStop(1, "rgba(" + light + ",0)")
    skyCtx.fillStyle = glow; skyCtx.fillRect(0, 0, W, H)
    skyCtx.fillStyle = color(DAY.disc, NIGHT.disc, t)
    skyCtx.beginPath(); skyCtx.arc(sx, sy, H * mix(0.034, 0.024, t), 0, 6.283); skyCtx.fill()

    // Three ranges of hills, paler with distance.
    for (var r = 0; r < 3; r++) {
      var base = horizon - H * (0.05 - r * 0.02)
      skyCtx.fillStyle = color(DAY.hills[r], NIGHT.hills[r], t)
      skyCtx.beginPath(); skyCtx.moveTo(0, H)
      for (var x = 0; x <= W + 16; x += 16) skyCtx.lineTo(x, base - Math.abs(ridge(x, r * 1.9 + 0.4, H * (0.05 - r * 0.012))))
      skyCtx.lineTo(W, H); skyCtx.closePath(); skyCtx.fill()
    }

    // A thin haze where the land meets the sky, lit by the low sun.
    var haze = skyCtx.createLinearGradient(0, horizon - H * 0.08, 0, horizon + H * 0.04)
    haze.addColorStop(0, "rgba(" + light + ",0)")
    haze.addColorStop(0.6, "rgba(" + light + "," + mix(0.28, 0.08, t) + ")")
    haze.addColorStop(1, "rgba(" + light + ",0)")
    skyCtx.fillStyle = haze; skyCtx.fillRect(0, horizon - H * 0.08, W, H * 0.12)

    var ground = skyCtx.createLinearGradient(0, horizon, 0, H)
    for (var f = 0; f < 3; f++) ground.addColorStop(f / 2, color(DAY.field[f], NIGHT.field[f], t))
    skyCtx.fillStyle = ground; skyCtx.fillRect(0, horizon - 2, W, H - horizon + 2)
  }

  // Wind: a slow breath over the whole field, and gusts that travel across it from the left.
  function gustAt(x, time) {
    var u = x / W
    var wave = Math.sin(u * 3.2 - time * 0.45) * 0.5 + 0.5
    var ripple = Math.sin(u * 8.6 - time * 1.1 + 1.7) * 0.5 + 0.5
    return wave * wave * wave * 0.85 + ripple * 0.15
  }

  function shadeOf(tone, step, t) {
    var d = DAY.grass[tone], n = NIGHT.grass[tone]
    var lift = [1.6, 2.6, 3.6][tone] * mix(1, 0.6, t)
    return "hsl(" + mix(d[0], n[0], t).toFixed(0) + "," + mix(d[1], n[1], t).toFixed(0) + "%," + (mix(d[2], n[2], t) + step * lift).toFixed(1) + "%)"
  }

  function drawGrass(time) {
    ctx.lineCap = "round"
    for (var l = 0; l < layers.length; l++) {
      var layer = layers[l], blades = layer.blades
      // Each blade's shade this frame: its own, lighter where a gust bends it and shows its sheen.
      for (var i = 0; i < blades.length; i++) {
        var b = blades[i]
        var gust = gustAt(b.x, time)
        b.bend = 0.18 + gust * 1.05 + Math.sin(time * b.flutter + b.phase) * 0.07
        b.step = b.shade + Math.round(gust * (1 + layer.tone))
      }
      ctx.lineWidth = layer.width
      for (var step = 0; step < 8; step++) {
        var any = false
        ctx.beginPath()
        for (var j = 0; j < blades.length; j++) {
          var blade = blades[j]
          if (blade.step !== step) continue
          any = true
          var reach = (blade.lean + blade.bend * layer.reach) * blade.h
          var tipX = blade.x + reach, tipY = blade.y - blade.h * (1 - Math.min(0.45, Math.abs(reach) / blade.h * 0.35))
          ctx.moveTo(blade.x, blade.y)
          ctx.quadraticCurveTo(blade.x + reach * 0.15, blade.y - blade.h * 0.55, tipX, tipY)
        }
        if (any) { ctx.strokeStyle = shadeOf(layer.tone, step, night); ctx.stroke() }
      }
    }
  }

  function launchBirds() {
    var leftward = Math.random() < 0.5
    var y = random(horizon * 0.25, horizon * 0.7)
    var size = random(5, 8)
    var count = 2 + Math.floor(Math.random() * 4)
    birds = []
    for (var i = 0; i < count; i++) birds.push({
      x: leftward ? W + 40 + i * random(18, 34) : -40 - i * random(18, 34),
      y: y + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * random(6, 12),
      size: size * random(0.85, 1.1), dir: leftward ? -1 : 1,
      speed: random(W / 34, W / 26), phase: random(0, 6.283)
    })
  }

  function drawBirds(time, dt) {
    if (night >= 0.6) return
    if (birds.length === 0) {
      birdWait -= dt
      if (birdWait <= 0) launchBirds()
      return
    }
    ctx.strokeStyle = DAY.bird
    ctx.globalAlpha = 1 - night / 0.6
    ctx.lineWidth = 1.3
    ctx.beginPath()
    var gone = true
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i]
      b.x += b.dir * b.speed * dt
      b.y += Math.sin(time * 0.6 + b.phase) * 4 * dt
      if (b.x > -60 && b.x < W + 60) gone = false
      // Wings beat in short runs, then the bird glides.
      var beating = Math.sin(time * 0.7 + b.phase) > 0.2
      var wing = beating ? Math.sin(time * 9 + b.phase) * 0.9 : 0.25
      var s = b.size
      ctx.moveTo(b.x - s, b.y - wing * s * 0.5)
      ctx.quadraticCurveTo(b.x - s * 0.45, b.y - s * 0.35 - wing * s * 0.25, b.x, b.y)
      ctx.quadraticCurveTo(b.x + s * 0.45, b.y - s * 0.35 - wing * s * 0.25, b.x + s, b.y - wing * s * 0.5)
    }
    ctx.stroke()
    ctx.globalAlpha = 1
    if (gone && birds.every(function (b) { return b.dir > 0 ? b.x > W : b.x < 0 })) { birds = []; birdWait = random(10, 28) }
  }

  function drawFireflies(time, dt) {
    if (night <= 0.3) return
    var shown = (night - 0.3) / 0.7
    for (var i = 0; i < fireflies.length; i++) {
      var f = fireflies[i]
      f.x += Math.sin(time * f.speed + f.phase) * f.dx * dt
      f.y += Math.cos(time * f.speed * 1.3 + f.phase) * 5 * dt
      var pulse = Math.max(0, Math.sin(time * f.speed * 3 + f.phase))
      if (pulse < 0.05) continue
      ctx.fillStyle = "rgba(226, 244, 150," + (0.16 * pulse * shown).toFixed(3) + ")"
      ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 6.283); ctx.fill()
      ctx.fillStyle = "rgba(240, 252, 190," + (0.85 * pulse * shown).toFixed(3) + ")"
      ctx.beginPath(); ctx.arc(f.x, f.y, 1.4, 0, 6.283); ctx.fill()
    }
  }

  function frame(time, dt) {
    paintSky()
    ctx.drawImage(sky, 0, 0, W, H)
    drawBirds(time, dt)
    drawGrass(time)
    drawFireflies(time, dt)
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight
    // A soft scene needs no more pixels than the screen's own; large screens take fewer.
    DPR = Math.min(window.devicePixelRatio || 1, W * H > 1920 * 1200 ? 1 : 1.5)
    canvas.width = Math.max(2, Math.floor(W * DPR)); canvas.height = Math.max(2, Math.floor(H * DPR))
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    horizon = H * 0.6
    skyKey = ""
    build()
  }

  var running = 0, last = 0, drawn = 0
  function tick(now) {
    running = 0
    if (document.hidden) return
    if (now - drawn >= 1000 / 30 - 1) {
      var dt = Math.min(0.06, (now - last) / 1000 || 1 / 30)
      last = now; drawn = now
      if (night !== nightTarget) {
        night += Math.sign(nightTarget - night) * Math.min(Math.abs(nightTarget - night), dt * 0.8)
      }
      frame(now / 1000, dt)
    }
    running = requestAnimationFrame(tick)
  }
  function start() {
    if (still.matches) { night = nightTarget; frame(12, 0); return }
    if (!running && !document.hidden) { last = performance.now(); running = requestAnimationFrame(tick) }
  }

  darkQuery.addEventListener("change", function () { nightTarget = darkQuery.matches ? 1 : 0; start() })
  still.addEventListener("change", start)
  document.addEventListener("visibilitychange", start)
  window.addEventListener("resize", function () { resize(); start(); if (still.matches) frame(12, 0) })

  resize()
  start()
})()
</script>
</body>
</html>
